# Native authentication remains at Elasticsearch/Kibana; no credential is embedded.
# Only this fixed private pair is proxied. Configuration is mounted read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Do not log query strings, source values or Authorization headers.
  log_format receipt '$remote_addr $request_method $status $request_time';
  access_log /dev/stdout receipt;
  server_tokens off;
  # TLS is on the VPS; redirects must preserve the browser's HTTPS host/port.
  absolute_redirect off;
  resolver 127.0.0.11 valid=30s ipv6=off;
  client_max_body_size 32m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $uri $native_next {
    ~^/s/sellergenome/ $uri;
    default /s/sellergenome/app/dashboards;
  }

  server {
    listen 8080 default_server;
    server_name _;
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"sellergenome-elastic-gateway","version":"1.0.0"}';
    }
    location / { return 404; }
  }

  server {
    listen 8080;
    server_name ~^((rig|vps)-)?elastic\.(lehana\.in|aidhunik\.com)$;
    location / {
      auth_basic "SellerGenome Elastic access";
      auth_basic_user_file /run/elastic-access/htpasswd;
      include /run/elastic-access/native-auth.conf;
      set $elastic_backend seller-persona-elasticsearch;
      proxy_pass http://$elastic_backend:9200$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }

  server {
    listen 8080;
    server_name ~^((rig|vps)-)?kibana\.(lehana\.in|aidhunik\.com)$;
    auth_basic "SellerGenome Elastic access";
    auth_basic_user_file /run/elastic-access/htpasswd;
    # Machine API clients keep normal Basic semantics; browser internals use sid.
    location ~ ^/(api/|s/sellergenome/api/) {
      include /run/elastic-access/native-auth.conf;
      set $kibana_backend seller-persona-kibana;
      proxy_pass http://$kibana_backend:5601$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /__native_login {
      set $login_backend sellergenome-elastic-access;
      proxy_pass http://$login_backend:8000/login$is_args$args;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control no-store always;
    }
    location / {
      # Run the native-session redirect after the Basic authentication phase.
      # A rewrite-phase return here would redirect anonymous users before auth.
      try_files /__always_use_native_proxy__ @kibana_session;
    }
    location @kibana_session {
      if ($cookie_sid = "") { return 302 /__native_login?next=$native_next; }
      set $kibana_backend seller-persona-kibana;
      proxy_pass http://$kibana_backend:5601$request_uri;
      # Real native session Cookie carries identity; don't force stateless auth.
      proxy_set_header Authorization "";
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
