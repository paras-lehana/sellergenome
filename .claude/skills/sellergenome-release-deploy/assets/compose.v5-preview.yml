# V5 preview: a SEPARATE container (own name, no static IP, loopback port 18090, scratch data in private/v5-preview,
# Traefik disabled, schedules paused) running the v5 worktree read-only. Never use /srv/sellergenome-v4/
# docker-compose.preview.yml — it reuses the production container name and IP and would replace production.
# Start:  docker compose -f compose.v5-preview.yml up -d   ·   Stop: docker compose -f compose.v5-preview.yml down (no -v)
# Live upstream/Payal in preview need env_files sellergenome-im-apis.env / sellergenome-sarvam-voice.env — add only if required.

name: sellergenome-v5-preview
services:
  v5-preview:   # not `app` — avoids a duplicate DNS alias next to production's `app`
    image: sellergenome:5.3.0   # match the live image: docker inspect -f "{{.Config.Image}}" sellergenome-v4
    container_name: sellergenome-v5-preview
    init: true
    read_only: true
    env_file:
    - /srv/sellergenome-v4/seller-persona-v4.env
    environment:
      PUBLIC_BASE_PATH: ''
      PUBLIC_BASE_URL: http://127.0.0.1:18090
      DEPLOYMENT_ENVIRONMENT: preview
      DATA_DIR: /srv/data
      DATASET_DIR: /source-dataset
      PRIVATE_CONFIG_DIR: /srv/config
      APPROVED_GLIDS_PATH: /srv/approved/approved_glids.json
      SESSION_COOKIE_NAME: persona_v5p_access
      OWNER_COOKIE_NAME: persona_v4_owner
      ELASTICSEARCH_INDEX_PREFIX: seller-persona-v4
      SERVER_HOST: lehana-rig
      PREVIEW_PAUSE_SCHEDULES: 'true'
      # No Elasticsearch: the V5 index prefix is locked to sellergenome-v5, so a preview pointed at ES would write runs,
      # personas and cache entries into the PRODUCTION indices. Without it the app uses its SQLite fallbacks.
      ELASTICSEARCH_URL: ''
      SARVAM_MCP_PYTHON: /opt/sarvam-mcp/bin/python
      SELLER_PRODUCTION_EXAMPLE_PATH: /srv/inputs/seller_persona_prod.json
      BUYER_ORIGINAL_PROMPT_PATH: /srv/inputs/Sarvam Prompt - Buyer Side VANI.docx.md
      PREVIEW_ORIGIN: http://127.0.0.1:18090
      SARVAM_SPEECH_SCOPE: designated_v4
    volumes:
    - /opt/sellergenome/.worktrees/v5:/app:ro
    - /opt/sellergenome/dataset:/source-dataset:ro
    - /opt/sellergenome/private/v5-preview/data:/srv/data
    - /opt/sellergenome/private/v5-preview/config:/srv/config
    - /opt/sellergenome/private/v4/approved:/srv/approved:ro
    - /opt/sellergenome/private/inputs/production:/srv/inputs:ro
    networks:
      root_default: null
    tmpfs:
    - /tmp:size=128m,mode=1777
    labels:
      traefik.enable: 'false'
      lehana.tier: dev
      lehana.priority: low
    ports:
    - 127.0.0.1:18090:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2
networks:
  root_default:
    external: true
