<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SellerGenome · Command Center</title>
  <meta name="description" content="Evidence-backed seller personas for IndiaMART's sales voice bot — watch calls, barge in, and inspect every API, cache and model decision.">
  <meta name="theme-color" content="#0b0e14">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="__BASE_PATH__/static/genome.svg" type="image/svg+xml">
  <link rel="preload" href="__BASE_PATH__/static/cc/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="__BASE_PATH__/static/cc/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="__BASE_PATH__/static/cc/tokens.css?v=__APP_VERSION__">
  <link rel="stylesheet" href="__BASE_PATH__/static/cc/app.css?v=__APP_VERSION__">
</head>
<body data-base="__BASE_PATH__" data-version="__APP_VERSION__">
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="rail" id="rail" aria-label="Navigation">
      <a class="brand" href="__BASE_PATH__/" aria-label="SellerGenome home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M8 4c0 8 16 8 16 16M8 28c0-8 16-8 16-16" stroke="var(--accent)"/><path d="M11 9h10M10 16h12M11 23h10" stroke="var(--text-2)"/></g></svg>
        <span><b>Seller</b>Genome<small>Command Center</small></span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="rail-foot">
        <span class="mono" id="build">v__APP_VERSION__</span>
        <a href="__BASE_PATH__/studio#legal/privacy">Privacy</a>
      </div>
    </aside>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu" aria-label="Open navigation" aria-controls="rail" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <form class="search" id="search" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <label class="sr" for="search-input">Find a seller by GLID, name, company or city</label>
        <input id="search-input" type="search" placeholder="Find a seller — GLID, name, company, city" maxlength="80">
        <kbd>/</kbd>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </form>
      <div class="top-actions">
        <div class="status-dots" id="status" aria-live="polite"></div>
        <span class="clock mono" id="clock" aria-label="India time"></span>
        <button class="icon-btn" id="theme" aria-label="Switch colour theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <button class="btn btn-ghost" id="auth">Sign in</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="inspector" aria-label="API inspector" aria-hidden="true" inert></aside>

  <dialog class="modal" id="login-dialog" aria-labelledby="login-title">
    <form method="dialog" id="login-form">
      <p class="eyebrow">PM access</p>
      <h2 id="login-title">Sign in to see private sellers</h2>
      <p class="muted">Synthetic sellers are open to everyone. The PM password unlocks the supplied dataset, live Redash for approved test GLIDs, admin and persona edits.</p>
      <label for="login-password">PM password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <p class="form-error" id="login-error" role="alert"></p>
      <div class="row-end">
        <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-primary" id="login-submit" value="default">Sign in</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">SellerGenome needs JavaScript for the live floor. The <a href="__BASE_PATH__/analysis">analysis atlas</a> works without it.</p></noscript>
  <script type="module" src="__BASE_PATH__/static/cc/main.js?v=__APP_VERSION__"></script>
</body>
</html>
